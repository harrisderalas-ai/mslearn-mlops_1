name: Manually trigger an Azure Machine Learning job

on:
  workflow_dispatch:
  pull_request:
       branches:
         - main

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repo
      uses: actions/checkout@main
    - name: Install az ml extension
      run: az extension add -n ml -y
    - name: Azure login
      uses: azure/login@v2
      with:
        creds: ${{secrets.AZURE_CREDENTIALS}}
    - name: Run Azure Machine Learning training job
      run: |
        RUN_NAME=$(az ml job create -f src/job.yml \
          --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
          --workspace-name ${{ vars.AZURE_WORKSPACE_NAME }} \
          --query name -o tsv)
        echo "Submitted job: $RUN_NAME"
        while true; do
          STATUS=$(az ml job show -n "$RUN_NAME" \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --workspace-name ${{ vars.AZURE_WORKSPACE_NAME }} \
            --query status -o tsv)
          echo "Status: $STATUS"
          case "$STATUS" in
            Completed) exit 0 ;;
            Failed|Canceled|NotResponding) exit 1 ;;
          esac
          sleep 30
        done

